name: Cross-platform portability gate

# Portability gate, not a release workflow. This proves the shared Go core
# (and, on one job, the shared frontend) compiles and its platform-neutral
# tests pass on every currently-supported/planned target OS. It never builds
# an installer, never runs the 23 product integration scripts, never
# publishes a release or tag, and uses no repository secrets. See
# docs/platform-support.md for the full cross-platform support contract
# this workflow exists to back up.

on:
  pull_request:
    paths:
      - "apps/server/**"
      - "apps/web/**"
      - ".github/workflows/cross-platform.yml"
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "apps/web/**"
      - ".github/workflows/cross-platform.yml"
  workflow_dispatch:

# docs/ci-reliability.md §5: scoped to this workflow's own identity
# plus the ref, so a superseded run on the same branch/PR is cancelled
# without ever touching a different workflow's concurrency group.
concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            cgo: "0"
          - name: linux-amd64
            os: ubuntu-latest
            cgo: "0"
          - name: linux-arm64
            os: ubuntu-24.04-arm
            cgo: "0"
          - name: macos-arm64
            os: macos-latest
            cgo: "1"
          - name: macos-amd64
            os: macos-15-intel
            cgo: "1"
    name: backend (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/server
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      # The repository's Go source is committed with LF line endings.
      # actions/checkout on the Windows runner defaults to core.autocrlf=true
      # and would otherwise rewrite every file to CRLF on checkout, which
      # gofmt always reports as needing reformatting regardless of actual
      # formatting - this is a checkout-configuration issue, not a real
      # source-formatting difference, so it is fixed here rather than by
      # relaxing the gofmt check itself.
      - name: Disable line-ending conversion on checkout
        shell: bash
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod

      - name: gofmt
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt would reformat:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

      - name: go build
        run: go build ./...

  frontend:
    name: frontend (linux-amd64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run i18n:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
