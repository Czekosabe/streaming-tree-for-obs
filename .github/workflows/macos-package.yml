name: macOS package verification

# Stage 20C1 native macOS package-verification gate, NOT a release
# workflow: no publication, no secrets, no Developer ID, no notarization,
# no GitHub Release, no Git tag (docs/macos-packaging.md §27/§32/§36).
# Builds and verifies the real, unsigned, CGO-enabled .app bundle and
# DMG on real, native, GitHub-hosted macOS runners (both Apple Silicon
# and Intel). On success, the verified DMG is also uploaded as a
# short-retention GitHub Actions artifact purely so a tester can
# download the exact CI-built, CI-verified candidate on a second
# machine - a manual/test release-candidate distribution mechanism
# only, mirroring windows-package.yml, never a production update
# source. Every other build/staging path is still discarded when the
# ephemeral runner is destroyed. See docs/macos-packaging.md for the
# full architecture this workflow proves, and .github/workflows/
# cross-platform.yml for the separate, lighter-weight portability gate
# this workflow does not replace.
#
# scripts/verify-macos-package.mjs is a platform-specific CI
# verification helper, explicitly not canonical local integration
# script #25 - the canonical local integration-script count remains 24
# (docs/macos-packaging.md §28/§37).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "apps/web/**"
      - "scripts/build-release-macos.sh"
      - "scripts/verify-macos-package.mjs"
      - "LICENSE"
      - "PRIVACY.md"
      - "LEGAL.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/macos-package.yml"

# docs/ci-reliability.md §5: scoped to this workflow's own identity
# plus the ref, so a superseded run on the same branch is cancelled
# without ever touching a different workflow's concurrency group.
concurrency:
  group: macos-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
          - name: macos-amd64
            os: macos-15-intel
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Identifies the manual-test distribution artifact uploaded below
      # (release-candidate distribution, mirroring windows-package.yml)
      # - resolved once, early, so both the build version and the
      # artifact name derive from the same value as the real workflow
      # head commit.
      - name: Resolve short commit SHA for the manual-test artifact
        id: shortsha
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # docs/macos-packaging.md §56: the package verification must
      # complete successfully at least twice per architecture - done
      # here as two consecutive rebuild+reverify passes in one native
      # job, each one a real, independent build and a real, independent
      # verification run, not a cached re-check of the first pass.
      - name: Build the macOS release package (pass 1)
        run: bash scripts/build-release-macos.sh --version "0.1.0-dev+ci1"

      - name: Verify the macOS package (pass 1)
        run: node scripts/verify-macos-package.mjs

      # Pass 2 is built under a manual-test-identifiable version
      # (rather than another anonymous "-dev+ci2") specifically so its
      # own already-verified output below can double as the release
      # candidate distributed to testers - a separate pass 3 rebuild
      # solely for upload would duplicate an existing, already-passing
      # build+verify cycle for no benefit.
      - name: Build the macOS release package (pass 2)
        run: bash scripts/build-release-macos.sh --version "0.1.0-manualtest+${{ steps.shortsha.outputs.sha }}"

      - name: Verify the macOS package (pass 2)
        run: node scripts/verify-macos-package.mjs

      # Test/release-candidate distribution only, not the Stage 20B
      # production updater source (canonical GitHub Releases, unchanged)
      # and not a GitHub Release itself. Runs only now that pass 2's own
      # DMG has actually passed verification above - never publishes a
      # package that failed verification under a normal-looking name.
      - name: Stage the verified DMG for upload (manual-test artifact, not a release)
        id: stage_artifact
        run: |
          set -euo pipefail
          output_dir="build/release-macos/output"
          dmg="$(find "$output_dir" -maxdepth 1 -name '*.dmg' | head -n1)"
          if [ -z "$dmg" ]; then
            echo "::error::No .dmg found in $output_dir to stage for upload."
            exit 1
          fi
          if [ ! -f "$dmg.sha256" ]; then
            echo "::error::No .sha256 sidecar found for $dmg."
            exit 1
          fi

          full_sha="$(git rev-parse HEAD)"
          version="0.1.0-manualtest+${{ steps.shortsha.outputs.sha }}"
          artifact_dir="$RUNNER_TEMP/macos-artifact-upload-${{ matrix.name }}"
          mkdir -p "$artifact_dir"
          cp "$dmg" "$artifact_dir/"
          cp "$dmg.sha256" "$artifact_dir/"

          arch="${{ matrix.name == 'macos-arm64' && 'arm64' || 'amd64' }}"
          {
            echo "product: Streaming Tree for OBS"
            echo "version: $version"
            echo "commit: $full_sha"
            echo "os: darwin"
            echo "architecture: $arch"
            echo "unsigned: true"
          } > "$artifact_dir/BUILD-INFO.txt"

          echo "Staged artifact contents:"
          ls -la "$artifact_dir"
          echo "dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"

      # 14 days is a bounded manual-testing window, not permanent
      # hosting - a real production binary is later hosted through a
      # canonical GitHub Release instead. The application updater never
      # reads Actions artifacts.
      - name: Upload the verified macOS DMG (manual-test artifact, not a release)
        uses: actions/upload-artifact@v7
        with:
          name: StreamingTreeForOBS-0.1.0-manualtest-${{ steps.shortsha.outputs.sha }}-darwin-${{ steps.stage_artifact.outputs.arch }}
          path: ${{ steps.stage_artifact.outputs.dir }}/*
          retention-days: 14
          if-no-files-found: error

      # Backstop only: both build-release-macos.sh and
      # verify-macos-package.mjs already clean up their own test-owned
      # processes and mounted disk images on every path, including
      # failure. This step exists in case a step above was killed
      # abruptly (e.g. a job timeout) before its own cleanup ran -
      # never treated as evidence of a passing verification on its own.
      - name: Clean up any leftover process or mounted image
        if: always()
        run: |
          pkill -f streaming-tree-server || true
          for volume in /Volumes/"Streaming Tree for OBS"*; do
            [ -e "$volume" ] && hdiutil detach "$volume" -force || true
          done
          rm -rf build/release-macos
