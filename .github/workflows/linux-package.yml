name: Linux package verification

# Stage 20D1 native Linux package-verification gate, NOT a release
# workflow: no publication, no secrets, no GitHub Release, no Git tag
# (docs/linux-desktop-packaging.md §23/§25). Builds and verifies the
# real, CGO-disabled, statically-linked .deb package on real, native,
# GitHub-hosted Ubuntu runners (both x64 and ARM64). On success, the
# verified .deb is also uploaded as a short-retention GitHub Actions
# artifact purely so a tester can download the exact CI-built,
# CI-verified candidate on a second machine - a manual/test
# release-candidate distribution mechanism only, mirroring
# windows-package.yml, never a production update source. Every other
# build/staging path is still discarded when the ephemeral runner is
# destroyed. See docs/linux-desktop-packaging.md for the full
# architecture this workflow proves, and .github/workflows/
# cross-platform.yml for the separate, lighter-weight portability gate
# this workflow does not replace.
#
# scripts/verify-linux-package.mjs is a platform-specific CI
# verification helper, explicitly not canonical local integration
# script #25 - the canonical local integration-script count remains 24
# (docs/linux-desktop-packaging.md §24).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "apps/web/**"
      - "scripts/build-release-linux.sh"
      - "scripts/verify-linux-package.mjs"
      - "LICENSE"
      - "PRIVACY.md"
      - "LEGAL.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/linux-package.yml"

# docs/ci-reliability.md §5: scoped to this workflow's own identity
# plus the ref, so a superseded run on the same branch is cancelled
# without ever touching a different workflow's concurrency group.
concurrency:
  group: linux-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install desktop-file-validate (best-effort)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends desktop-file-utils || true

      - name: Install an ephemeral D-Bus session + Secret Service for the credential-store smoke test
        run: sudo apt-get install -y --no-install-recommends dbus-x11 gnome-keyring || true

      # Identifies the manual-test distribution artifact uploaded below
      # (release-candidate distribution, mirroring windows-package.yml)
      # - resolved once, early, so both the build version and the
      # artifact name derive from the same value as the real workflow
      # head commit.
      - name: Resolve short commit SHA for the manual-test artifact
        id: shortsha
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # docs/linux-desktop-packaging.md §15: proves the real Secret
      # Service backend against a real, hermetic, ephemeral session -
      # never a real user credential, no committed secret, torn down
      # with the runner. dbus-run-session starts and tears down a
      # throwaway session bus for exactly this command; gnome-keyring's
      # own daemon is unlocked with an empty password, valid only for
      # this ephemeral session/keyring. If dbus-run-session or
      # gnome-keyring-daemon are unavailable this step is skipped
      # (non-fatal) rather than faking a pass - the existing smoke test
      # itself already treats "no usable OS credential store" as a
      # skip, not a failure, for exactly this reason.
      - name: Real Secret Service smoke test (ephemeral D-Bus session)
        working-directory: apps/server
        run: |
          if ! command -v dbus-run-session >/dev/null 2>&1 || ! command -v gnome-keyring-daemon >/dev/null 2>&1; then
            echo "dbus-run-session or gnome-keyring-daemon not available - skipping (non-fatal)"
            exit 0
          fi
          dbus-run-session -- bash -c '
            set -e
            eval "$(printf "" | gnome-keyring-daemon --unlock --components=secrets)"
            export STREAMING_TREE_CREDENTIAL_SMOKE_TEST=1
            go test ./internal/secrets/... -run TestKeyringStoreAgainstTheRealOSCredentialStore -v -count=1
          '

      # docs/linux-desktop-packaging.md §17: the package-verification
      # must complete successfully at least twice per architecture -
      # done here as two consecutive rebuild+reverify passes in one
      # native job, each one a real, independent build and a real,
      # independent verification run, not a cached re-check of the
      # first pass.
      - name: Build the Linux release package (pass 1)
        run: bash scripts/build-release-linux.sh --version "0.1.0-dev+ci1"

      - name: Verify the Linux package (pass 1)
        run: node scripts/verify-linux-package.mjs

      # Pass 2 is built under a manual-test-identifiable version
      # (rather than another anonymous "-dev+ci2") specifically so its
      # own already-verified output below can double as the release
      # candidate distributed to testers - a separate pass 3 rebuild
      # solely for upload would duplicate an existing, already-passing
      # build+verify cycle for no benefit.
      - name: Build the Linux release package (pass 2)
        run: bash scripts/build-release-linux.sh --version "0.1.0-manualtest+${{ steps.shortsha.outputs.sha }}"

      - name: Verify the Linux package (pass 2)
        run: node scripts/verify-linux-package.mjs

      # Test/release-candidate distribution only, not the Stage 20B
      # production updater source (canonical GitHub Releases, unchanged)
      # and not a GitHub Release itself. Runs only now that pass 2's own
      # .deb has actually passed verification above - never publishes a
      # package that failed verification under a normal-looking name.
      - name: Stage the verified .deb for upload (manual-test artifact, not a release)
        id: stage_artifact
        run: |
          set -euo pipefail
          output_dir="build/release-linux/output"
          deb="$(find "$output_dir" -maxdepth 1 -name '*.deb' | head -n1)"
          if [ -z "$deb" ]; then
            echo "::error::No .deb found in $output_dir to stage for upload."
            exit 1
          fi
          if [ ! -f "$deb.sha256" ]; then
            echo "::error::No .sha256 sidecar found for $deb."
            exit 1
          fi

          full_sha="$(git rev-parse HEAD)"
          version="0.1.0-manualtest+${{ steps.shortsha.outputs.sha }}"
          artifact_dir="$RUNNER_TEMP/linux-artifact-upload-${{ matrix.name }}"
          mkdir -p "$artifact_dir"
          cp "$deb" "$artifact_dir/"
          cp "$deb.sha256" "$artifact_dir/"

          arch="${{ matrix.name == 'linux-arm64' && 'arm64' || 'amd64' }}"
          {
            echo "product: Streaming Tree for OBS"
            echo "version: $version"
            echo "commit: $full_sha"
            echo "os: linux"
            echo "architecture: $arch"
            echo "unsigned: true"
          } > "$artifact_dir/BUILD-INFO.txt"

          echo "Staged artifact contents:"
          ls -la "$artifact_dir"
          echo "dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"

      # 14 days is a bounded manual-testing window, not permanent
      # hosting - a real production binary is later hosted through a
      # canonical GitHub Release instead. The application updater never
      # reads Actions artifacts.
      - name: Upload the verified Linux .deb (manual-test artifact, not a release)
        uses: actions/upload-artifact@v7
        with:
          name: StreamingTreeForOBS-0.1.0-manualtest-${{ steps.shortsha.outputs.sha }}-linux-${{ steps.stage_artifact.outputs.arch }}
          path: ${{ steps.stage_artifact.outputs.dir }}/*
          retention-days: 14
          if-no-files-found: error

      # Backstop only: both build-release-linux.sh and
      # verify-linux-package.mjs already clean up their own test-owned
      # processes, installed packages, and D-Bus sessions on every
      # path, including failure. This step exists in case a step above
      # was killed abruptly (e.g. a job timeout) before its own cleanup
      # ran - never treated as evidence of a passing verification on
      # its own.
      - name: Clean up any leftover process or installed package
        if: always()
        run: |
          pkill -f streaming-tree-server || true
          sudo dpkg -r streaming-tree-for-obs || true
          rm -rf build/release-linux
