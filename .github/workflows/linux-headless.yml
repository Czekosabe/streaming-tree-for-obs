name: Linux headless service verification

# Stage 20D2A native Linux headless-service verification gate, NOT a
# release workflow: no publication, no secrets, no artifact upload
# (docs/linux-headless-server.md §17). Builds the same .deb
# scripts/build-release-linux.sh already produces (now including the
# systemd unit + provisioning helper) and proves the headless-mode
# process-level contract natively - loopback-only bind enforcement, no
# browser/desktop-UI code path, the encrypted headless secret store,
# graceful SIGTERM shutdown - plus static systemd unit correctness via
# systemd-analyze verify. Real systemd PID-1 service lifecycle is only
# claimed if this workflow's own runner reality-check (the first step
# below) confirms it is genuinely available - never assumed from
# `systemctl` merely being present on PATH (docs/linux-headless-
# server.md §16).
#
# scripts/verify-linux-headless.mjs is a platform-specific CI
# verification helper, explicitly not canonical integration script #25
# - the canonical local integration-script count remains 24.
#
# Stage 20D2B: also verifies the remote-management/control-plane
# contract (docs/remote-management.md) through a real, ephemeral-CA
# TLS reverse-proxy boundary via scripts/verify-linux-remote-
# management.mjs - itself another platform-specific helper, not
# canonical script #25 either.
#
# Stage 20D2C: also verifies the remote-ingest/remote-overlay contract
# (docs/remote-ingest.md) through a genuinely isolated network
# namespace + veth boundary (not localhost relabeled as remote) via
# scripts/verify-linux-remote-server.mjs - another platform-specific
# helper, not canonical script #25 either. Requires real network-
# namespace/CAP_NET_ADMIN capability and ffmpeg; the script itself
# verifies both are genuinely available before attempting anything,
# and fails loudly rather than silently downgrading if not.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      # docs/ci-reliability.md §4: scripts/build-release-linux.sh (the
      # build script this workflow also runs) stages apps/web's build
      # output and the four legal documents into both the embedded
      # binary and the .deb - the same real inputs linux-package.yml
      # already tracks. Previously omitted here; a real gap found by
      # direct source inspection, not by assumption.
      - "apps/web/**"
      - "LICENSE"
      - "PRIVACY.md"
      - "LEGAL.md"
      - "THIRD_PARTY_NOTICES.md"
      - "scripts/build-release-linux.sh"
      - "scripts/provision-headless-master-key.sh"
      - "scripts/provision-admin-password.sh"
      - "scripts/systemd/streaming-tree.service"
      - "scripts/verify-linux-headless.mjs"
      - "scripts/verify-linux-remote-management.mjs"
      - "scripts/verify-linux-remote-server.mjs"
      - ".github/workflows/linux-headless.yml"

# docs/ci-reliability.md §5: scoped to this workflow's own identity
# plus the ref, so a superseded run on the same branch is cancelled
# without ever touching a different workflow's concurrency group.
concurrency:
  group: linux-headless-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  headless:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
    name: headless (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # docs/linux-headless-server.md §16: inspect the real runner
      # before deciding what can honestly be claimed - never assumed.
      - name: Runner systemd reality check
        run: |
          echo "PID 1:"; ps -p 1 -o pid,comm= || true
          echo "systemctl --version:"; systemctl --version || true
          echo "systemctl is-system-running:"; systemctl is-system-running || true
          echo "systemd-analyze --version:"; systemd-analyze --version || true

      - name: Install systemd-analyze / desktop-file-validate (best-effort)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends systemd desktop-file-utils || true

      - name: Build the Linux release package (includes the systemd unit + provisioning helper)
        run: bash scripts/build-release-linux.sh --version "0.1.0-dev+headless-ci1"

      - name: Verify the headless service contract (pass 1)
        run: node scripts/verify-linux-headless.mjs

      - name: Build the Linux release package (pass 2)
        run: bash scripts/build-release-linux.sh --version "0.1.0-dev+headless-ci2"

      - name: Verify the headless service contract (pass 2)
        run: node scripts/verify-linux-headless.mjs

      # docs/remote-management.md: Stage 20D2B - the remote management/
      # control plane. Reuses the same package already built above
      # (no third build pass) since --remote-management is layered on
      # top of the identical headless binary/package. Traverses a real
      # ephemeral-CA TLS reverse-proxy boundary - never a fake
      # X-Forwarded-Proto header sent directly to the loopback backend.
      #
      # Output is teed to a file so a failure can be surfaced as a
      # readable ::error:: annotation below - this environment's own
      # monitoring has no authenticated access to raw step logs
      # (docs/ci-reliability.md), so a bare `run:` alone would leave a
      # failure here undiagnosable from outside GitHub's own UI.
      - name: Verify the remote-management contract
        run: |
          set -o pipefail
          node scripts/verify-linux-remote-management.mjs 2>&1 | tee /tmp/rm-verify.log

      - name: Show remote-management verification diagnostics on failure
        if: failure()
        run: |
          TAIL="$(tail -c 3000 /tmp/rm-verify.log 2>/dev/null || echo 'no output captured')"
          ENCODED="${TAIL//$'\n'/%0A}"
          ENCODED="${ENCODED//$'\r'/}"
          echo "::error title=verify-linux-remote-management.mjs failure (${{ matrix.name }})::${ENCODED}"

      # docs/remote-ingest.md §15: real network-namespace/veth
      # isolation and a real synthetic FFmpeg publisher - neither is
      # present on the base runner image, installed explicitly here
      # (iproute2 is normally already present; ffmpeg is not).
      - name: Install iproute2/ffmpeg for the Stage 20D2C remote-server verification
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iproute2 ffmpeg

      - name: Verify the remote-server (remote ingest + remote overlay) contract
        run: |
          set -o pipefail
          node scripts/verify-linux-remote-server.mjs 2>&1 | tee /tmp/rs-verify.log

      - name: Show remote-server verification diagnostics on failure
        if: failure()
        run: |
          TAIL="$(tail -c 8000 /tmp/rs-verify.log 2>/dev/null || echo 'no output captured')"
          ENCODED="${TAIL//$'\n'/%0A}"
          ENCODED="${ENCODED//$'\r'/}"
          echo "::error title=verify-linux-remote-server.mjs failure (${{ matrix.name }})::${ENCODED}"

      - name: Clean up any leftover process, service, package, or network namespace
        if: always()
        run: |
          sudo systemctl disable --now streaming-tree.service || true
          pkill -f streaming-tree-server || true
          sudo pkill -f mediamtx || true
          sudo dpkg -r streaming-tree-for-obs || true
          sudo rm -rf /etc/streaming-tree /var/lib/private/streaming-tree /run/streaming-tree
          sudo ip netns del streamtree-d2c-client || true
          sudo ip link del veth-d2c-host || true
          sudo rm -f /usr/local/share/ca-certificates/streamtree-d2c-test-ca.crt
          sudo update-ca-certificates || true
          rm -rf build/release-linux
