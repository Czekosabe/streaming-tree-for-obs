name: Windows package verification

# Stage 20A/20E native Windows package-verification gate, NOT a release
# workflow: no publication, no secrets, no code signing (no production
# code-signing certificate exists for this project yet - see docs/
# windows-packaging.md §20), no artifact upload of the package itself
# (only ephemeral failure-diagnostic logs, see below). Builds and
# verifies the real, unsigned Inno Setup installer on a real, native,
# GitHub-hosted Windows runner, then discards everything when the
# ephemeral runner is destroyed. Inno Setup 6 ships pre-installed on
# the windows-2022 runner image, so no install step is needed here -
# see docs/windows-packaging.md for the full architecture this
# workflow proves, and .github/workflows/cross-platform.yml for the
# separate, lighter-weight portability gate this workflow does not
# replace.
#
# Only one target exists today: scripts/build-release.ps1 always builds
# GOOS=windows/GOARCH=amd64 - there is no Windows ARM64 release target
# to add a second matrix entry for (docs/platform-support.md).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "apps/web/**"
      - "scripts/build-release.ps1"
      - "scripts/verify-packaged-app.mjs"
      - "scripts/verify-installer.mjs"
      - "scripts/verify-updater.mjs"
      - "scripts/installer/streaming-tree.iss"
      - "LICENSE"
      - "PRIVACY.md"
      - "LEGAL.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/windows-package.yml"

# docs/ci-reliability.md §5: scoped to this workflow's own identity
# plus the ref, so a superseded run on the same branch is cancelled
# without ever touching a different workflow's concurrency group.
concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: package (windows-amd64)
    # Pinned rather than windows-latest: this workflow's own
    # correctness depends on Inno Setup being pre-installed, a fact
    # confirmed for windows-2022 specifically - "latest" is free to
    # move to a newer image at any time without that guarantee.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Real evidence, not pure speculation: this workflow's own first
      # run failed at "recomputed SHA-256 matches the recorded digest"
      # - the installer's own hash, recomputed moments after
      # build-release.ps1 already recorded it, from the SAME on-disk
      # file with nothing else in between that should touch its bytes.
      # A defender real-time scan racing a freshly-written installer
      # (and Node's own hermetic silent-install/rehash cycle a few
      # steps later) is the standard, well-documented explanation for
      # exactly this class of Windows-CI symptom - excluding this
      # workflow's own build/output/temp paths is the standard,
      # low-risk mitigation. Best-effort: never fails the job on its
      # own (`-ErrorAction SilentlyContinue` plus a try/catch), since a
      # restricted runner environment refusing this is not itself a
      # reason to fail the whole verification.
      - name: Exclude build output from real-time antivirus scanning (best-effort)
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath (Join-Path $env:GITHUB_WORKSPACE 'build') -ErrorAction Stop
            Add-MpPreference -ExclusionPath $env:RUNNER_TEMP -ErrorAction Stop
            Add-MpPreference -ExclusionPath $env:TEMP -ErrorAction Stop
            Write-Host "Defender exclusions added for build output and temp directories."
          } catch {
            Write-Host "Could not add Defender exclusions (non-fatal): $($_.Exception.Message)"
          }

      # docs/windows-packaging.md: the package verification must
      # complete successfully at least twice - done here as two
      # consecutive rebuild+reverify passes in one native job, each one
      # a real, independent build and a real, independent verification
      # run, not a cached re-check of the first pass. Each pass
      # verifies both the staged packaged-runtime executable
      # (verify-packaged-app.mjs) and the real Inno Setup installer's
      # own silent install/uninstall flow (verify-installer.mjs).
      #
      # Every verification script's combined stdout/stderr is also
      # saved to $env:RUNNER_TEMP - docs/ci-reliability.md §7's own
      # established mechanism for this exact problem (a native Windows
      # step failing with nothing beyond a generic Checks-API "exit
      # code 1"). $LASTEXITCODE still reflects node's real exit code
      # after Tee-Object, since Tee-Object is a cmdlet, not a native
      # command, and does not overwrite it - no pipefail-equivalent
      # workaround is needed in PowerShell the way bash requires one.
      - name: Build the Windows release package (pass 1)
        shell: pwsh
        run: powershell -File scripts/build-release.ps1 -Version "0.1.0-dev+ci1"

      - name: Verify the packaged runtime (pass 1)
        shell: pwsh
        run: |
          node scripts/verify-packaged-app.mjs 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\verify-packaged-app-pass1.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the installer (pass 1)
        shell: pwsh
        run: |
          node scripts/verify-installer.mjs 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\verify-installer-pass1.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the Windows release package (pass 2)
        shell: pwsh
        run: powershell -File scripts/build-release.ps1 -Version "0.1.0-dev+ci2"

      - name: Verify the packaged runtime (pass 2)
        shell: pwsh
        run: |
          node scripts/verify-packaged-app.mjs 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\verify-packaged-app-pass2.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the installer (pass 2)
        shell: pwsh
        run: |
          node scripts/verify-installer.mjs 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\verify-installer-pass2.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Self-contained: builds its own OLD/NEW -IntegrationTest release
      # pair via build-release.ps1 and drives a real update-check/
      # download/verify/install-handoff cycle against a fake local
      # update API - see docs/updater.md §41. Run once, not per pass
      # above, since it never reads either pass's own output.
      - name: Verify updater compatibility
        shell: pwsh
        run: |
          node scripts/verify-updater.mjs 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\verify-updater.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Adds zero output to a normal successful run. On a failure,
      # prints every captured log's content as ::error:: annotations so
      # the real failure reason surfaces on the commit/PR checks view
      # without needing raw job-log download access (which requires
      # repository-admin rights even on a public repository, confirmed
      # directly against this repository's own logs endpoint - see
      # docs/ci-reliability.md). Chunked in fixed-size line groups from
      # the START of each file, never a tail-only slice, so the actual
      # failing step's own output is never silently dropped by a length
      # limit the way an earlier debugging session in this project once
      # found tail-based truncation could do.
      - name: Extract verification failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $logs = Get-ChildItem -Path $env:RUNNER_TEMP -Filter '*.log' -ErrorAction SilentlyContinue
          if ($null -eq $logs -or $logs.Count -eq 0) {
            Write-Host "No verification log files were captured before the failure."
            exit 0
          }
          foreach ($log in $logs) {
            $content = Get-Content -Path $log.FullName -Raw -ErrorAction SilentlyContinue
            if ([string]::IsNullOrEmpty($content)) { continue }
            $lines = $content -split "`r?`n"
            $chunkSize = 20
            for ($i = 0; $i -lt $lines.Count; $i += $chunkSize) {
              $end = [Math]::Min($i + $chunkSize - 1, $lines.Count - 1)
              $chunk = ($lines[$i..$end] -join "`n")
              if ([string]::IsNullOrWhiteSpace($chunk)) { continue }
              # A GitHub Actions workflow-command message is parsed as a
              # single log line - an embedded raw newline silently ends
              # the command early, so everything after the chunk's own
              # first line would otherwise be dropped from the
              # annotation without any error. Percent-encoding (%25,
              # %0D, %0A - "%" first, so its own encoded form is never
              # re-encoded) is GitHub's own documented escaping for
              # workflow-command values.
              $encoded = $chunk -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              Write-Host "::error title=$($log.Name) (lines $($i + 1)-$($end + 1))::$encoded"
            }
          }

      # Short-lived, ephemeral diagnostic data only - raw verification
      # script output, no binaries, no SQLite state, no credentials, no
      # environment dump. Never uploaded on a successful run.
      - name: Upload verification failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-package-failure-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/*.log
          retention-days: 5
          if-no-files-found: ignore

      # Backstop only: build-release.ps1 and every verify-*.mjs script
      # above already clean up their own test-owned processes and
      # installed/staged directories on every path, including failure.
      # This step exists in case a step above was killed abruptly
      # (e.g. a job timeout) before its own cleanup ran - never treated
      # as evidence of a passing verification on its own.
      - name: Clean up any leftover process or build output
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name 'streaming-tree-server' -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $env:GITHUB_WORKSPACE 'build/release')
